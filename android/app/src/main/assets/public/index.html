<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2563EB" />
  <title>VELORA — One Platform. Endless Possibilities.</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
    #root { display: flex; flex-direction: column; }
    ::-webkit-scrollbar { display: none; }
    input, textarea { -webkit-appearance: none; appearance: none; }

    /* ===== SPLASH (pure HTML+CSS) ===== */
    .sa-splash-root {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 42%,
          rgba(124, 58, 237, 0.20) 0%,
          rgba(37, 99, 235, 0.35) 35%,
          #0B1120 75%);
      z-index: 99999;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .sa-splash-root.sa-splash-exit {
      animation: sa-splash-exit 500ms cubic-bezier(.4, 0, .2, 1) forwards;
    }

    .sa-splash-background {
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, #0B1120 0%, #1E2A4A 40%, #2D1B69 100%);
      opacity: 0;
      animation: sa-bg-in 300ms ease-out forwards;
    }

    .sa-splash-glow {
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: rgba(124, 58, 237, 0.20);
      filter: blur(70px);
      opacity: 0;
      animation: sa-glow-pulse 3s ease-in-out 150ms infinite;
    }

    .sa-ring {
      position: absolute;
      border: 1px solid rgba(147, 130, 255, 0.18);
      border-radius: 50%;
      opacity: 0;
      animation: sa-ring-expand 3s ease-out infinite;
    }
    .sa-ring-1 { width: 160px; height: 160px; animation-delay: 700ms; }
    .sa-ring-2 { width: 160px; height: 160px; animation-delay: 1500ms; }
    .sa-ring-3 { width: 160px; height: 160px; animation-delay: 2300ms; }

    .sa-splash-logo-reveal {
      position: relative;
      z-index: 2;
      opacity: 0;
      animation: sa-logo-reveal 900ms cubic-bezier(.16, 1, .3, 1) 250ms forwards;
    }
    .sa-splash-logo-float {
      animation: sa-logo-float 4s ease-in-out 1100ms infinite;
    }
    .sa-splash-logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.3));
    }

    .sa-splash-brand {
      position: relative;
      z-index: 2;
      margin-top: 24px;
      font-size: 32px;
      font-weight: 800;
      color: #ffffff;
      text-align: center;
      letter-spacing: -0.5px;
      opacity: 0;
      animation: sa-text-reveal 600ms cubic-bezier(.22, 1, .36, 1) 750ms forwards;
    }
    .sa-splash-brand-en {
      position: relative;
      z-index: 2;
      margin-top: 4px;
      font-size: 16px;
      font-weight: 600;
      color: rgba(147, 130, 255, 0.85);
      text-align: center;
      letter-spacing: 3px;
      opacity: 0;
      animation: sa-text-reveal 500ms cubic-bezier(.22, 1, .36, 1) 850ms forwards;
    }
    .sa-splash-tagline {
      position: relative;
      z-index: 2;
      margin-top: 16px;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.65);
      text-align: center;
      opacity: 0;
      animation: sa-text-reveal 500ms cubic-bezier(.22, 1, .36, 1) 1000ms forwards;
    }

    .sa-particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(147, 130, 255, 0.5);
      opacity: 0;
      animation: sa-particle-float 4s ease-in-out infinite;
    }
    .sa-particle-1 { width: 5px; height: 5px; top: 15%; left: 18%; animation-delay: 1200ms; animation-duration: 3.5s; }
    .sa-particle-2 { width: 4px; height: 4px; top: 22%; right: 20%; animation-delay: 1400ms; animation-duration: 4s; }
    .sa-particle-3 { width: 6px; height: 6px; bottom: 20%; left: 15%; animation-delay: 1600ms; animation-duration: 3.2s; }
    .sa-particle-4 { width: 3px; height: 3px; bottom: 25%; right: 18%; animation-delay: 1800ms; animation-duration: 3.8s; }
    .sa-particle-5 { width: 4px; height: 4px; top: 40%; left: 8%; animation-delay: 2000ms; animation-duration: 4.2s; }
    .sa-particle-6 { width: 5px; height: 5px; top: 60%; right: 10%; animation-delay: 2200ms; animation-duration: 3.6s; }
    .sa-particle-7 { width: 3px; height: 3px; bottom: 35%; left: 25%; animation-delay: 2400ms; animation-duration: 4.4s; }
    .sa-particle-8 { width: 4px; height: 4px; top: 30%; right: 12%; animation-delay: 2600ms; animation-duration: 3.4s; }

    .sa-splash-loader {
      position: relative;
      z-index: 2;
      margin-top: 40px;
      display: flex;
      gap: 6px;
      opacity: 0;
      animation: sa-loader-in 400ms ease-out 2000ms forwards;
    }
    .sa-splash-loader span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(147, 130, 255, 0.8);
      animation: sa-loader-dot 1.2s ease-in-out infinite;
    }
    .sa-splash-loader span:nth-child(2) { animation-delay: 150ms; }
    .sa-splash-loader span:nth-child(3) { animation-delay: 300ms; }

    @keyframes sa-bg-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes sa-glow-pulse {
      0%, 100% { transform: scale(0.85); opacity: 0.45; }
      50%      { transform: scale(1.15); opacity: 0.85; }
    }
    @keyframes sa-logo-reveal {
      0%   { opacity: 0; transform: scale(0.72); filter: blur(12px); }
      60%  { opacity: 1; transform: scale(1.06); filter: blur(0); }
      100% { opacity: 1; transform: scale(1);    filter: blur(0); }
    }
    @keyframes sa-logo-float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-5px); }
    }
    @keyframes sa-ring-expand {
      0%   { transform: scale(0.8); opacity: 0.4; }
      100% { transform: scale(1.8); opacity: 0; }
    }
    @keyframes sa-text-reveal {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes sa-particle-float {
      0%, 100% { transform: translateY(0) translateX(0); opacity: 0.2; }
      50%      { transform: translateY(-18px) translateX(6px); opacity: 0.5; }
    }
    @keyframes sa-loader-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes sa-loader-dot {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40%            { opacity: 1;   transform: scale(1); }
    }
    @keyframes sa-splash-exit {
      from { opacity: 1; transform: scale(1); }
      to   { opacity: 0; transform: scale(1.015); }
    }

    @media (max-width: 360px) {
      .sa-splash-brand { font-size: 28px; }
      .sa-splash-brand-en { font-size: 14px; }
      .sa-splash-glow { width: 200px; height: 200px; }
      .sa-ring-1, .sa-ring-2, .sa-ring-3 { width: 130px; height: 130px; }
    }
    @media (min-width: 768px) {
      .sa-splash-glow { width: 340px; height: 340px; }
      .sa-ring-1, .sa-ring-2, .sa-ring-3 { width: 200px; height: 200px; }
      .sa-splash-brand { font-size: 38px; }
    }

    /* ===== ONBOARDING ANIMATIONS ===== */
    @keyframes onboardingFadeIn { from { opacity: 0; transform: translateY(40px) scale(0.92); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes onboardingTextIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes onboardingFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes onboardingBreath { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes onboardingCheckPop { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
    @keyframes onboardingDotPulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    @keyframes onboardingMarkerBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

    .sa-onboarding-illustration { animation: onboardingFadeIn 600ms ease-out forwards; }
    .sa-onboarding-text         { animation: onboardingTextIn 600ms ease-out 200ms forwards; }
    .sa-illust-float           { animation: onboardingFloat 3s ease-in-out infinite; }
    .sa-illust-float-slow       { animation: onboardingFloat 3.5s ease-in-out infinite; }
    .sa-illust-float-delay      { animation: onboardingFloat 4s ease-in-out 200ms infinite; }
    .sa-illust-breath           { animation: onboardingBreath 2.5s ease-in-out infinite; }
    .sa-illust-check            { animation: onboardingCheckPop 400ms ease-out forwards; }
    .sa-illust-check-delay      { animation: onboardingCheckPop 400ms ease-out 600ms forwards; }
    .sa-illust-pulse            { animation: onboardingDotPulse 2s ease-in-out infinite; }
    .sa-illust-pulse-slow       { animation: onboardingDotPulse 2.5s ease-in-out infinite; }
    .sa-illust-marker           { animation: onboardingMarkerBounce 2.5s ease-in-out infinite; }
    .sa-illust-marker-delay     { animation: onboardingMarkerBounce 2.2s ease-in-out 300ms infinite; }

    /* ===== VERIFY EMAIL (existing) ===== */
    @keyframes verifyScaleIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    @keyframes verifyFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes verifySuccessIn { from { opacity: 0; } to { opacity: 1; } }

    .sa-verify-scale-in   { animation: verifyScaleIn 600ms ease-out forwards; }
    .sa-verify-success-in { animation: verifySuccessIn 400ms ease-out forwards; }
  </style>
